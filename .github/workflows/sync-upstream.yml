name: Sync Fork with Upstream

# Hourly: merge upstream (QuantumNous/new-api) into this fork's main branch
# using GitHub's merge-upstream API, sync upstream tags into the fork, and
# fast-forward the ai branch onto main (ai carries fork-only changes).
#
# Builds happen ONLY for: new upstream tags seen by the sync, or a manual
# dispatch with force_build=true (for fork-only changes). Plain pushes to main
# and upstream merges that only advance main do NOT build the image.
#
# 打包规则（fork 自有版本）：
#   每次构建基于 ai 分支，新增一个 tag：<上游最新版本>-<单字母>。
#   例如上游最新 tag 是 v1.0.0-rc.22，则我们的版本依次为
#   v1.0.0-rc.22-a、-b、-c……；上游发布新版本后字母重置为 a。
#   镜像同时推送 ghcr.io/qjx12388/new-api:latest[-<arch>]（服务器 compose 用）
#   和 ghcr.io/qjx12388/new-api:<version>[-<arch>]（可追溯）。
#
# If upstream has diverged in a way that conflicts with local changes,
# the merge-upstream API returns 409 and the run fails — resolve manually:
#   git remote add upstream https://github.com/QuantumNous/new-api.git
#   git fetch upstream
#   git merge upstream/main   # resolve conflicts
#   git push origin main
# ai 与 main 的合并冲突同理手动解决后推送 ai。

on:
  schedule:
    - cron: '23 * * * *' # hourly at :23
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force-build the fork image even without a new upstream tag'
        required: true
        type: boolean
        default: false
  push:
    branches: [main]

# Serialize sync/build runs: merge-upstream's own push to main re-triggers
# this workflow, and overlapping builds would race on the same image tags.
concurrency:
  group: sync-upstream-build
  cancel-in-progress: false

permissions:
  contents: write # merge-upstream + tag sync + ai fast-forward + version tags
  packages: write # push image to ghcr.io

jobs:
  sync:
    # Runs on schedule/manual dispatch only; push events have nothing to merge.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      tag_changed: ${{ steps.detect.outputs.tag_changed }}
    steps:
      - name: Checkout (full history and tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record previous state
        id: before
        run: |
          echo "main_sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          echo "tag=$(git tag --sort=-v:refname | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Merge upstream into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Retry transient GitHub API failures (5xx/network); a real merge
          # conflict (409) fails immediately and still needs manual resolution.
          for attempt in 1 2 3; do
            if out=$(gh api repos/${{ github.repository }}/merge-upstream -f branch=main 2>&1); then
              echo "$out"
              break
            fi
            echo "$out"
            if echo "$out" | grep -q '409'; then
              echo "::error::merge-upstream returned 409 (diverged); resolve manually per workflow comments"
              exit 1
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::merge-upstream failed after 3 attempts"
              exit 1
            fi
            echo "merge-upstream attempt $attempt failed, retrying in 30s..."
            sleep 30
          done

      - name: Keep ai branch in sync with main
        run: |
          set -e
          git fetch origin ai main
          if git merge-base --is-ancestor origin/ai origin/main; then
            # ai 落后或等于 main：直接快进
            git push origin origin/main:refs/heads/ai
          else
            # ai 含未发布的 fork 改动：把 main 合并进 ai；冲突则失败需人工处理
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B ai origin/ai
            git merge origin/main --no-edit
            git push origin ai
          fi

      - name: Sync workflow files from ai to main
        run: |
          set -e
          # A 方案（用户拍板）：.github/workflows/ 是 ai→main 的唯一例外目录，
          # 文件拷贝式同步（非 merge，无冲突），main 的代码内容仍只来自上游。
          git fetch origin ai main
          if ! git diff --quiet origin/main origin/ai -- .github/workflows/; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B main origin/main
            git checkout origin/ai -- .github/workflows/
            git commit -m "chore: sync .github/workflows from ai [skip ci]"
            git push origin main
          fi

      - name: Sync upstream tags and detect changes
        id: detect
        run: |
          set -e
          git remote add upstream https://github.com/QuantumNous/new-api.git
          git fetch upstream main --tags
          git fetch origin main

          merged=false
          after_sha=$(git rev-parse origin/main)
          if [ "$after_sha" != "${{ steps.before.outputs.main_sha }}" ]; then
            merged=true
          fi

          # Bring upstream tags into the fork so the latest tag on origin
          # always reflects what has already been seen.
          git push origin --tags

          tag_changed=false
          latest_tag=$(git tag --sort=-v:refname | head -n1)
          if [ "$latest_tag" != "${{ steps.before.outputs.tag }}" ]; then
            tag_changed=true
          fi

          echo "merged=$merged tag_changed=$tag_changed latest_tag=$latest_tag"
          echo "tag_changed=$tag_changed" >> "$GITHUB_OUTPUT"

  version:
    needs: sync
    # 与 build 同条件：上游新 tag 或手动 force_build 时，为本次构建计算并创建
    # fork 自有版本 tag（<上游最新版本>-<单字母>）。
    if: >-
      always() && (
        needs.sync.outputs.tag_changed == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.force_build)
      )
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
    steps:
      - name: Checkout ai (full history and tags)
        uses: actions/checkout@v4
        with:
          ref: ai
          fetch-depth: 0

      - name: Compute fork version tag
        id: calc
        run: |
          set -e
          # 上游最新版本 = 排除我们自己的 -<单字母> 形式 tag 后的最新 tag
          base=$(git tag --sort=-v:refname | grep -vE -- '-[a-z]$' | head -n1)
          if [ -z "$base" ]; then
            echo "::error::no upstream tag found"
            exit 1
          fi
          last=$(git tag -l "${base}-?" | sed "s/^${base}-//" | sort | tail -n1)
          if [ -z "$last" ]; then
            next=a
          elif [ "$last" = "z" ]; then
            echo "::error::version letters exhausted for ${base}"
            exit 1
          else
            next=$(echo "$last" | tr 'a-y' 'b-z')
          fi
          version="${base}-${next}"
          echo "computed version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$version"

      - name: Push version tag (PAT 优先以触发 release.yml)
        env:
          # GITHUB_TOKEN 推送的 tag 不会触发其他 workflow（GitHub 防递归限制），
          # 用 PAT 推送才能让 release.yml 自动生成带二进制产物的 GitHub Release。
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          set -e
          version="${{ steps.calc.outputs.version }}"
          if [ -n "$RELEASE_PAT" ]; then
            git push "https://x-access-token:${RELEASE_PAT}@github.com/${{ github.repository }}.git" "refs/tags/$version"
          else
            echo "::warning::secrets.RELEASE_PAT 未配置，tag 用 GITHUB_TOKEN 推送——release.yml 不会自动触发，需在 GitHub Settings > Secrets 添加 RELEASE_PAT（repo+workflow 权限）"
            git push origin "refs/tags/$version"
          fi

  build:
    needs: [sync, version]
    # Build when the sync saw a new upstream tag, or when manually dispatched
    # with force_build=true (for shipping fork-only changes). Pushes to main
    # never build. always() is required because a skipped sync job would
    # otherwise skip this job too.
    if: >-
      always() && (
        needs.sync.outputs.tag_changed == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.force_build)
      )
    name: Build & push (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout ai
        uses: actions/checkout@v4
        with:
          ref: ai

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile # upstream Dockerfile, unmodified
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/qjx12388/new-api:latest-${{ matrix.arch }}
            ghcr.io/qjx12388/new-api:${{ needs.version.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manifest:
    name: Create multi-arch manifest
    needs: [version, build]
    # sync may fail (e.g. upstream workflow-file changes that GITHUB_TOKEN
    # cannot push); still publish the manifest whenever the builds succeeded.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push manifests (latest + fork version)
        run: |
          docker buildx imagetools create \
            -t ghcr.io/qjx12388/new-api:latest \
            -t ghcr.io/qjx12388/new-api:${{ needs.version.outputs.version }} \
            ghcr.io/qjx12388/new-api:latest-amd64 \
            ghcr.io/qjx12388/new-api:latest-arm64
