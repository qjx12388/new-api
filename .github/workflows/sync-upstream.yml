name: Sync Fork with Upstream

# Hourly: merge upstream (QuantumNous/new-api) into this fork's main branch
# using GitHub's merge-upstream API, and sync upstream tags into the fork.
# Builds happen ONLY for new upstream tags seen by the sync (published as
# ghcr.io/qjx12388/new-api:latest). Plain pushes to main and upstream merges
# that only advance main do NOT build the image.
#
# If upstream has diverged in a way that conflicts with local changes,
# the merge-upstream API returns 409 and the run fails — resolve manually:
#   git remote add upstream https://github.com/QuantumNous/new-api.git
#   git fetch upstream
#   git merge upstream/main   # resolve conflicts
#   git push origin main

on:
  schedule:
    - cron: '23 * * * *' # hourly at :23
  workflow_dispatch:
  push:
    branches: [main]

# Serialize sync/build runs: merge-upstream's own push to main re-triggers
# this workflow, and overlapping builds would race on the same image tags.
concurrency:
  group: sync-upstream-build
  cancel-in-progress: false

permissions:
  contents: write # merge-upstream + tag sync
  packages: write # push image to ghcr.io

jobs:
  sync:
    # Runs on schedule/manual dispatch only; push events have nothing to merge.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      tag_changed: ${{ steps.detect.outputs.tag_changed }}
    steps:
      - name: Checkout (full history and tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record previous state
        id: before
        run: |
          echo "main_sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          echo "tag=$(git tag --sort=-v:refname | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Merge upstream into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Retry transient GitHub API failures (5xx/network); a real merge
          # conflict (409) fails immediately and still needs manual resolution.
          for attempt in 1 2 3; do
            if out=$(gh api repos/${{ github.repository }}/merge-upstream -f branch=main 2>&1); then
              echo "$out"
              break
            fi
            echo "$out"
            if echo "$out" | grep -q '409'; then
              echo "::error::merge-upstream returned 409 (diverged); resolve manually per workflow comments"
              exit 1
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::merge-upstream failed after 3 attempts"
              exit 1
            fi
            echo "merge-upstream attempt $attempt failed, retrying in 30s..."
            sleep 30
          done


      - name: Sync upstream tags and detect changes
        id: detect
        run: |
          set -e
          git remote add upstream https://github.com/QuantumNous/new-api.git
          git fetch upstream main --tags
          git fetch origin main

          merged=false
          after_sha=$(git rev-parse origin/main)
          if [ "$after_sha" != "${{ steps.before.outputs.main_sha }}" ]; then
            merged=true
          fi

          # Bring upstream tags into the fork so the latest tag on origin
          # always reflects what has already been seen.
          git push origin --tags

          tag_changed=false
          latest_tag=$(git tag --sort=-v:refname | head -n1)
          if [ "$latest_tag" != "${{ steps.before.outputs.tag }}" ]; then
            tag_changed=true
          fi

          echo "merged=$merged tag_changed=$tag_changed latest_tag=$latest_tag"
          echo "tag_changed=$tag_changed" >> "$GITHUB_OUTPUT"

  build:
    needs: sync
    # Build only when the sync saw a new upstream tag. Pushes to main never
    # build. always() is required because a skipped sync job would otherwise
    # skip this job too.
    if: always() && needs.sync.outputs.tag_changed == 'true'
    name: Build & push (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile # upstream Dockerfile, unmodified
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/qjx12388/new-api:latest-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manifest:
    name: Create multi-arch manifest
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push manifest (latest)
        run: |
          docker buildx imagetools create \
            -t ghcr.io/qjx12388/new-api:latest \
            ghcr.io/qjx12388/new-api:latest-amd64 \
            ghcr.io/qjx12388/new-api:latest-arm64
