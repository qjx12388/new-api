name: Sync Fork with Upstream

# 分支策略（2026-08-01 重构）：
#   - main = 上游(QuantumNous/new-api)的纯镜像，零 fork 提交，merge-upstream 永远快进。
#   - ai   = fork 的工作分支（默认分支），承载全部自有改动与全部 workflow。
#   - 定时任务只从默认分支(ai)运行，main 上不再放任何 workflow。
#
# 同步逻辑：
#   1. 每小时 merge-upstream 快进 main，并同步上游 tags。
#   2. 仅当上游出现新 tag（或手动 force_build）时，才把 main 合并进 ai ——
#      ai 只在需要构建时吸收上游代码，避免每小时无谓冲突。
#   3. ai 合并若冲突（fork 改动的文件上游也改了，如 i18n locale），自动开
#      issue 通知人工处理，本次运行不视为失败，tag/构建跳过。
#   4. main 若出现 409（意味着有人直接推了 main，破坏纯镜像约定），开 issue 报警。
#
# 打包规则（fork 自有版本）：
#   每次构建基于 ai 分支，新增一个 tag：<上游最新版本>-<单字母>。
#   例如上游最新 tag 是 v1.0.0-rc.22，则我们的版本依次为
#   v1.0.0-rc.22-a、-b、-c……；上游发布新版本后字母重置为 a。
#   镜像同时推送 ghcr.io/qjx12388/new-api:latest[-<arch>]（服务器 compose 用）
#   和 ghcr.io/qjx12388/new-api:<version>[-<arch>]（可追溯）。
#
# ai 合并冲突的人工处理：
#   git checkout ai && git fetch upstream
#   git merge upstream/main   # 解决冲突（locale json 建议按 key 三方合并）
#   git push origin ai

on:
  schedule:
    - cron: '23 * * * *' # hourly at :23
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force-build the fork image even without a new upstream tag'
        required: true
        type: boolean
        default: false

# Serialize sync/build runs: merge-upstream's own push to main re-triggers
# nothing (main has no workflows), but overlapping manual runs would race on
# the same image tags.
concurrency:
  group: sync-upstream-build
  cancel-in-progress: false

permissions:
  contents: write # merge-upstream + tag sync + ai merge + version tags
  packages: write # push image to ghcr.io
  issues: write  # ai 合并冲突 / main 409 时开 issue 报警
  actions: write # 允许 version job dispatch release.yml（workflow_dispatch API 需要）

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      tag_changed: ${{ steps.detect.outputs.tag_changed }}
      ai_ready: ${{ steps.aimerge.outputs.ai_ready }}
    steps:
      - name: Checkout (full history and tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream into main (fast-forward only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # main 是纯上游镜像，merge-upstream 必然快进；409 说明有人直接推了 main。
          for attempt in 1 2 3; do
            if out=$(gh api repos/${{ github.repository }}/merge-upstream -f branch=main 2>&1); then
              echo "$out"
              break
            fi
            echo "$out"
            if echo "$out" | grep -q '409'; then
              title="main 纯镜像被破坏：merge-upstream 返回 409"
              if ! gh issue list --state open --search "$title" --json title -q '.[].title' | grep -q "$title"; then
                gh issue create --title "$title" --body "main 应是上游纯镜像，但 merge-upstream 返回 409（run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}）。检查是否有人直接推送了 main；确认后执行：\n\n\`\`\`bash\ngit fetch upstream\ngit push -f origin upstream/main:main\n\`\`\`"
              fi
              echo "::error::merge-upstream 409 —— main 不是纯镜像，已开 issue"
              exit 1
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::merge-upstream failed after 3 attempts"
              exit 1
            fi
            echo "merge-upstream attempt $attempt failed, retrying in 30s..."
            sleep 30
          done

      - name: Sync upstream tags and detect changes
        id: detect
        run: |
          set -e
          # 记录同步前的完整 tag 集合（版本排序不可靠：上游历史 tag 命名
          # 混用 rc21 / rc.22 两种格式，v:refname 会把 v1.0.0-rc21-i 排在
          # v1.0.0-rc.23 之上——2026-08-02 因此漏检过新 tag）
          git tag | sort > /tmp/tags_before.txt

          git remote add upstream https://github.com/QuantumNous/new-api.git
          git fetch upstream main --tags
          git fetch origin main

          # Bring upstream tags into the fork so the latest tag on origin
          # always reflects what has already been seen.
          git push origin --tags

          git tag | sort > /tmp/tags_after.txt
          new_tags=$(comm -13 /tmp/tags_before.txt /tmp/tags_after.txt)
          tag_changed=false
          if [ -n "$new_tags" ]; then
            tag_changed=true
          fi

          # 最新上游发布 tag：按创建时间倒序，限 v<数字> 开头（排除 nightly-*），
          # 排除我们自己的 <版本>-<单字母> tag
          latest_tag=$(git tag --sort=-creatordate | grep -E '^v[0-9]' | grep -vE -- '-[a-z]$' | head -n1)

          echo "tag_changed=$tag_changed latest_tag=$latest_tag new_tags=$(echo $new_tags | tr '\n' ' ')"
          echo "tag_changed=$tag_changed" >> "$GITHUB_OUTPUT"

      - name: Merge main into ai (仅新 tag 或 force_build 时)
        id: aimerge
        if: >-
          steps.detect.outputs.tag_changed == 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.force_build)
        run: |
          git fetch origin ai main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ai origin/ai
          if git merge origin/main --no-edit; then
            git push origin ai
            echo "ai_ready=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "ai_ready=false" >> "$GITHUB_OUTPUT"
            echo "AI_MERGE_CONFLICT=true" | tee -a "$GITHUB_ENV"
            echo "::warning::main→ai 合并冲突，跳过本次 ai 更新与构建，转人工"
          fi

      - name: Open issue on ai merge conflict
        if: env.AI_MERGE_CONFLICT == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="main → ai 合并冲突，需人工处理"
          if ! gh issue list --state open --search "$title" --json title -q '.[].title' | grep -q "$title"; then
            gh issue create --title "$title" --body "sync-upstream 在 \`git merge origin/main\`（into \`ai\`）时发生冲突（run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}）。通常是上游改动了 fork 也改过的文件（如 web/src/i18n/locales/*.json）。本地处理：\n\n\`\`\`bash\ngit checkout ai && git fetch upstream\ngit merge upstream/main\n# 解决冲突；locale json 建议按 key 三方合并（base→ai 的改动 overlay 到 upstream 版本上）\ngit push origin ai\n\`\`\`\n\n解决后下次 sync 会自动继续。"
          fi
          # 冲突不是系统故障，run 标成功，等人工处理后自然恢复
          exit 0

  version:
    needs: sync
    # 与 build 同条件：上游新 tag 或手动 force_build 时，为本次构建计算并创建
    # fork 自有版本 tag（<上游最新版本>-<单字母>）。
    if: >-
      always() &&
      needs.sync.outputs.ai_ready != 'false' && (
        needs.sync.outputs.tag_changed == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.force_build)
      )
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
    steps:
      - name: Checkout ai (full history and tags)
        uses: actions/checkout@v4
        with:
          ref: ai
          fetch-depth: 0

      - name: Compute fork version tag
        id: calc
        run: |
          set -e
          # 上游最新版本 = 按创建时间倒序的第一个上游发布 tag：
          # 限 v<数字> 开头（排除 nightly-*），排除我们自己的 -<单字母> 形式 tag。
          # 不用版本排序：上游历史 tag 混用 rc21/rc.22 命名，v:refname 排序不可靠
          base=$(git tag --sort=-creatordate | grep -E '^v[0-9]' | grep -vE -- '-[a-z]$' | head -n1)
          if [ -z "$base" ]; then
            echo "::error::no upstream tag found"
            exit 1
          fi
          last=$(git tag -l "${base}-?" | sed "s/^${base}-//" | sort | tail -n1)
          if [ -z "$last" ]; then
            next=a
          elif [ "$last" = "z" ]; then
            echo "::error::version letters exhausted for ${base}"
            exit 1
          else
            next=$(echo "$last" | tr 'a-y' 'b-z')
          fi
          version="${base}-${next}"
          echo "computed version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$version"

      - name: Push version tag (PAT 优先以触发 release.yml)
        env:
          # GITHUB_TOKEN 推送的 tag 不会触发其他 workflow（GitHub 防递归限制），
          # 用 PAT 推送才能让 release.yml 自动生成带二进制产物的 GitHub Release。
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          set -e
          version="${{ steps.calc.outputs.version }}"
          if [ -n "$RELEASE_PAT" ]; then
            git push "https://x-access-token:${RELEASE_PAT}@github.com/${{ github.repository }}.git" "refs/tags/$version"
          else
            echo "::warning::secrets.RELEASE_PAT 未配置，tag 用 GITHUB_TOKEN 推送——release.yml 不会自动触发，需在 GitHub Settings > Secrets 添加 RELEASE_PAT（repo+workflow 权限）"
            git push origin "refs/tags/$version"
          fi

      - name: Trigger release.yml for the version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # PAT 推 tag 在部分 token 类型下仍不触发 workflow（实测），
          # 这里直接 workflow_dispatch release.yml，确定性触发。
          # release.yml 用 git describe --tags 取版本号，ref 传 tag 即可。
          gh api repos/${{ github.repository }}/actions/workflows/release.yml/dispatches \
            -f ref="${{ steps.calc.outputs.version }}"

  build:
    needs: [sync, version]
    # Build when the sync saw a new upstream tag, or when manually dispatched
    # with force_build=true (for shipping fork-only changes). Pushes to main
    # never build. always() is required because a skipped sync job would
    # otherwise skip this job too.
    if: >-
      always() &&
      needs.sync.outputs.ai_ready != 'false' && (
        needs.sync.outputs.tag_changed == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.force_build)
      )
    name: Build & push (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout ai
        uses: actions/checkout@v4
        with:
          ref: ai

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile # upstream Dockerfile, unmodified
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/qjx12388/new-api:latest-${{ matrix.arch }}
            ghcr.io/qjx12388/new-api:${{ needs.version.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manifest:
    name: Create multi-arch manifest
    needs: [version, build]
    # sync may fail (e.g. upstream workflow-file changes that GITHUB_TOKEN
    # cannot push); still publish the manifest whenever the builds succeeded.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push manifests (latest + fork version)
        run: |
          docker buildx imagetools create \
            -t ghcr.io/qjx12388/new-api:latest \
            -t ghcr.io/qjx12388/new-api:${{ needs.version.outputs.version }} \
            ghcr.io/qjx12388/new-api:latest-amd64 \
            ghcr.io/qjx12388/new-api:latest-arm64
