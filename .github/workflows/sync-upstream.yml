name: Sync Fork with Upstream

# Hourly: merge upstream (QuantumNous/new-api) into this fork's main branch
# using GitHub's merge-upstream API, and sync upstream tags into the fork.
# If main was advanced or a new upstream tag appeared, build the Docker image
# with the repository's Dockerfile as-is and push ghcr.io/qjx12388/new-api:latest.
#
# Pushing your own commits to main skips the sync and builds the image
# directly. Pushing a tag also builds directly, from the tagged commit, and
# additionally publishes ghcr.io/qjx12388/new-api:<tag>. Pushes made by this
# workflow itself (github-actions[bot], from merge-upstream) do not trigger a
# second build.
#
# If upstream has diverged in a way that conflicts with local changes,
# the merge-upstream API returns 409 and the run fails — resolve manually:
#   git remote add upstream https://github.com/QuantumNous/new-api.git
#   git fetch upstream
#   git merge upstream/main   # resolve conflicts
#   git push origin main

on:
  schedule:
    - cron: '23 * * * *' # hourly at :23
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['*']

# Serialize sync/build runs: merge-upstream's own push to main re-triggers
# this workflow, and overlapping builds would race on the same image tags.
concurrency:
  group: sync-upstream-build
  cancel-in-progress: false

permissions:
  contents: write # merge-upstream + tag sync
  packages: write # push image to ghcr.io

jobs:
  sync:
    # Own pushes to main only build; there is nothing to merge.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Checkout (full history and tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record previous state
        id: before
        run: |
          echo "main_sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          echo "tag=$(git tag --sort=-v:refname | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Merge upstream into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/merge-upstream \
            -f branch=main

      - name: Sync upstream tags and detect changes
        id: detect
        run: |
          set -e
          git remote add upstream https://github.com/QuantumNous/new-api.git
          git fetch upstream main --tags
          git fetch origin main

          merged=false
          after_sha=$(git rev-parse origin/main)
          if [ "$after_sha" != "${{ steps.before.outputs.main_sha }}" ]; then
            merged=true
          fi

          # Bring upstream tags into the fork so the latest tag on origin
          # always reflects what has already been seen.
          git push origin --tags

          tag_changed=false
          latest_tag=$(git tag --sort=-v:refname | head -n1)
          if [ "$latest_tag" != "${{ steps.before.outputs.tag }}" ]; then
            tag_changed=true
          fi

          echo "merged=$merged tag_changed=$tag_changed latest_tag=$latest_tag"
          changed=false
          if [ "$merged" = "true" ] || [ "$tag_changed" = "true" ]; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  build:
    needs: sync
    # Build when the sync changed something (schedule/manual), or when a human
    # pushed to main. always() is required because a skipped sync job would
    # otherwise skip this job too.
    if: >-
      always() && (
        needs.sync.outputs.changed == 'true' ||
        (github.event_name == 'push' && github.actor != 'github-actions[bot]')
      )
    name: Build & push (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: imagetags
        run: |
          TAGS="ghcr.io/qjx12388/new-api:latest-${{ matrix.arch }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="$TAGS,ghcr.io/qjx12388/new-api:${GITHUB_REF_NAME}-${{ matrix.arch }}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile # upstream Dockerfile, unmodified
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.imagetags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manifest:
    name: Create multi-arch manifest
    needs: [build]
    # always() is required: sync may be skipped (push events), and a skipped
    # ancestor would otherwise skip this job even when build succeeded.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push manifest (latest)
        run: |
          docker buildx imagetools create \
            -t ghcr.io/qjx12388/new-api:latest \
            ghcr.io/qjx12388/new-api:latest-amd64 \
            ghcr.io/qjx12388/new-api:latest-arm64

      - name: Create & push manifest (version tag)
        if: github.ref_type == 'tag'
        run: |
          docker buildx imagetools create \
            -t ghcr.io/qjx12388/new-api:${GITHUB_REF_NAME} \
            ghcr.io/qjx12388/new-api:${GITHUB_REF_NAME}-amd64 \
            ghcr.io/qjx12388/new-api:${GITHUB_REF_NAME}-arm64
